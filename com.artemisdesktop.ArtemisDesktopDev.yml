app-id: com.artemisdesktop.ArtemisDesktopDev
runtime: org.kde.Platform
runtime-version: '6.6'
sdk: org.kde.Sdk
command: artemis-dev
finish-args:
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  - --share=network
  - --filesystem=home
  # Full GPU and hardware acceleration access (Intel, AMD, NVIDIA)
  - --device=all
  # Clean environment for VA-API and VDPAU so Flatpak runtime drivers are used
  - --env=LIBVA_DRIVER_NAME=
  - --unset-env=LIBVA_DRIVER_NAME
  - --env=LIBVA_DRIVERS_PATH=
  - --unset-env=LIBVA_DRIVERS_PATH
  - --env=VDPAU_DRIVER_PATH=
  - --unset-env=VDPAU_DRIVER_PATH
  # Gamescope & screensaver support
  - --talk-name=org.freedesktop.ScreenSaver
  - --filesystem=xdg-run/gamescope-0
  - --filesystem=host-os:ro

modules:
  - name: opus
    sources:
      - type: archive
        url: https://downloads.xiph.org/releases/opus/opus-1.4.tar.gz
        sha256: c9b32b4253be5ae63d1ff16eea06b94b5f0f2951b7a02aceef58e3a3ce49c51f

  - name: sdl2
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL/releases/download/release-2.28.5/SDL2-2.28.5.tar.gz
        sha256: 332cb37d0be20cb9541739c61f79bae5a477427d79ae85e352089afdaf6666e4

  - name: sdl2-ttf
    sources:
      - type: archive
        url: https://github.com/libsdl-org/SDL_ttf/releases/download/release-2.20.2/SDL2_ttf-2.20.2.tar.gz
        sha256: 9dc71ed93487521b107a2c4a9ca6bf43fb62f6bddd5c26b055e6b91418a22053

  # NVIDIA NVDEC/NVENC support (headers)
  - name: nv-codec-headers
    buildsystem: simple
    build-commands:
      - make -j$(nproc)
      - make PREFIX=/app install
    sources:
      - type: git
        url: https://github.com/FFmpeg/nv-codec-headers.git
        branch: master

  # Build libplacebo from source for Vulkan/HDR support (critical for Steam Deck)
  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=enabled
      - -Dopengl=enabled
      - -Dshaderc=enabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: archive
        url: https://code.videolan.org/videolan/libplacebo/-/archive/v7.349.0/libplacebo-v7.349.0.tar.gz
        sha256: 79120e685a1836344b51b13b6a5661622486a84e4d4a35f6c8d01679a20fbc86
      # Vendor glad2 into libplacebo's 3rdparty/ so Meson can find it without network access
      - type: git
        url: https://github.com/Dav1dde/glad.git
        branch: glad2
        dest: 3rdparty/glad
      - type: git
        url: https://github.com/pallets/jinja.git
        branch: main
        dest: 3rdparty/jinja
      - type: git
        url: https://github.com/pallets/markupsafe.git
        branch: main
        dest: 3rdparty/markupsafe
    modules:
      # Provide spirv-cross for the OpenGL backend (C shared library with pkg-config)
      - name: spirv-cross
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DSPIRV_CROSS_ENABLE_TESTS=OFF
          - -DSPIRV_CROSS_ENABLE_C_API=ON
          - -DSPIRV_CROSS_CLI=OFF
          - -DSPIRV_CROSS_ENABLE_PKG_CONFIG=ON
          - -DBUILD_SHARED_LIBS=ON
          - -DCMAKE_INSTALL_PREFIX=/app
        sources:
          - type: git
            url: https://github.com/KhronosGroup/SPIRV-Cross.git
            branch: main
      # Build shaderc and vendor its exact dependencies to ensure compatibility
      - name: shaderc
        buildsystem: cmake-ninja
        builddir: true
        config-opts:
          - -DCMAKE_BUILD_TYPE=Release
          - -DSHADERC_SKIP_COPYRIGHT_CHECK=ON
          - -DSHADERC_SKIP_EXAMPLES=ON
          - -DSHADERC_SKIP_TESTS=ON
          - -DSHADERC_ENABLE_WERROR=OFF
        sources:
          - type: git
            url: https://github.com/google/shaderc.git
            branch: main
          # Vendor glslang at the location shaderc expects
          - type: git
            url: https://github.com/KhronosGroup/glslang.git
            branch: main
            dest: third_party/glslang
          # Vendor SPIRV-Tools and SPIRV-Headers in the expected layout
          - type: git
            url: https://github.com/KhronosGroup/SPIRV-Tools.git
            branch: main
            dest: third_party/spirv-tools
          - type: git
            url: https://github.com/KhronosGroup/SPIRV-Headers.git
            branch: main
            dest: third_party/spirv-tools/external/spirv-headers

  # Custom FFmpeg with CUDA/NVDEC/NVENC, VAAPI, VDPAU, Vulkan, and libplacebo
  - name: ffmpeg
    buildsystem: simple
    build-commands:
      - export PKG_CONFIG_PATH=/app/lib/pkgconfig:${PKG_CONFIG_PATH}
      - |
        ./configure \
          --prefix=/app \
          --enable-shared --disable-static \
          --disable-debug \
          --enable-gpl --enable-nonfree \
          --enable-libdrm --enable-vaapi --enable-vdpau \
          --enable-nvenc --enable-nvdec --enable-cuvid \
          --enable-vulkan --enable-libplacebo
      - make -j$(nproc)
      - make install
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg.git
        branch: release/6.1

  - name: artemis-desktop-dev
    buildsystem: simple
    build-commands:
      - install -d /app/lib/GL # Workaround for NVIDIA driver issue
      - rm -f .qmake.stash .qmake.cache
      - find . -name "Makefile*" -delete || true
      - rm -rf AntiHooking/ || true
      - rm -rf config.tests/SL/ || true
      - rm -f app/test_*.cpp || true
      # Ensure our pkg-config entries (ffnvcodec, ffmpeg libs) are found first
      - export PKG_CONFIG_PATH=/app/lib/pkgconfig:${PKG_CONFIG_PATH}
      - qmake6 artemis.pro CONFIG+=release "QMAKE_CXXFLAGS+=-fPIC" "QMAKE_RPATHDIR=/app/lib"
      - make -j$(nproc)
      - install -Dm755 app/artemis /app/bin/artemis-dev
    sources:
      - type: dir
        path: .
    post-install:
      - |
        install -Dm644 /dev/stdin /app/share/applications/com.artemisdesktop.ArtemisDesktopDev.desktop << 'EOD'
        [Desktop Entry]
        Type=Application
        Name=Artemis Desktop (Dev)
        Comment=Artemis Desktop Development Build - Steam Deck Compatible
        Exec=artemis-dev
        Icon=com.artemisdesktop.ArtemisDesktopDev
        Categories=Game;Network;
        Keywords=gaming;streaming;nvidia;gamestream;sunshine;steam;deck;
        EOD
      # Copy icon files if they exist
      - |
        if [ -f app/artemis.png ]; then
          install -Dm644 app/artemis.png /app/share/icons/hicolor/256x256/apps/com.artemisdesktop.ArtemisDesktopDev.png
        fi
        if [ -f app/res/artemis.svg ]; then
          install -Dm644 app/res/artemis.svg /app/share/icons/hicolor/scalable/apps/com.artemisdesktop.ArtemisDesktopDev.svg
        fi
